kind: breaking
body: Add optional fab-rs LRO poll_interval and timeout configuration in seconds. Fabric/ARM fallback polling now uses 2, 7, then 20 seconds; jobs retain Retry-After or 10 seconds. Overall waiting has no default timeout, while individual poll/result requests remain bounded and server not-before hints are preserved.
