[package]
name = "fabric-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded Fabric read-command composition with caller-owned dependencies"
default-run = "fab-rs"

[package.metadata.fabric]
layer = "cli"

[[bin]]
name = "fab-rs"
path = "src/main.rs"

[[test]]
name = "definition_copy_v2"
path = "tests/definition_copy_v2.rs"
required-features = ["native-host", "v2-copy"]

[[test]]
name = "run_notebook_wire"
path = "tests/run_notebook_wire.rs"
required-features = ["native-host", "v2-run"]

[[test]]
name = "stage_deploy"
path = "tests/stage_deploy.rs"
required-features = ["v2-deploy"]

[[bin]]
name = "fab-cli-discovery"
path = "src/bin/fab_cli.rs"
required-features = ["v2-discovery"]

[[test]]
name = "v2_help"
path = "tests/v2_help.rs"
required-features = ["v2-discovery"]

[[bin]]
name = "fab-cli-v2"
path = "src/v2_main.rs"
required-features = ["headless"]

[[bin]]
name = "fab-cli-workspace"
path = "src/workspace_v2_main.rs"
required-features = ["workspace-read-v2"]

[[test]]
name = "workspace_v2"
path = "tests/workspace_v2.rs"
required-features = ["workspace-read-v2"]

[[test]]
name = "v2_preview"
path = "tests/v2_preview.rs"
required-features = ["v2-preview"]

[[test]]
name = "v2_preview_entry"
path = "tests/v2_preview_entry.rs"

[[test]]
name = "interactive_arguments"
required-features = ["interactive"]

[[test]]
name = "notebook_workload_identity"
required-features = ["notebook-workload"]

[features]
default = []
semantic-model = ["dep:fabric-cli-semantic-model"]
semantic-model-dotnet = ["semantic-model", "fabric-cli-semantic-model/dotnet"]
workspace-read-v2 = []
v2-cancel = []
v2-run = []
v2-refresh = ["dep:fabric-sdk-graph"]
v2-copy = []
v2-deploy = []
v2-discovery = ["dep:fabric-sdk-discovery"]
runtime-v2 = []
v2-preview = ["dep:fabric-cli-ontology"]
interactive = ["native-host", "fabric-identity/interactive"]
repl = ["dep:fabric-cli-repl", "fabric-cli-repl/reedline-editor"]
windows-broker = ["dep:fabric-identity", "dep:tokio", "fabric-identity/windows-broker"]
native-host = ["dep:fabric-identity", "dep:tokio", "dep:fabric-sdk-http", "dep:fabric-sdk-transport", "fabric-sdk-transport/hyper-rustls", "dep:chrono"]
native-read = ["native-host", "windows-broker"]
headless = ["native-host", "fabric-identity/headless"]
notebook-workload = ["headless", "fabric-sdk-http/notebook-workload"]
certificate-store-windows = ["headless", "fabric-identity/certificate-store-windows"]
certificate-store-pkcs11 = ["headless", "fabric-identity/certificate-store-pkcs11"]
certificate-store-macos = ["headless", "fabric-identity/certificate-store-macos"]
self-update = ["dep:fabric-cli-update", "fabric-cli-update/bounded-helper", "dep:ring", "dep:tokio", "dep:fabric-sdk-transport", "fabric-sdk-transport/hyper-rustls"]

[dependencies]
fabric-cli-semantic-model = { workspace = true, optional = true }
fabric-cli-ontology = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
fabric-cli-repl = { workspace = true, optional = true }
fabric-cli-update = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
clap.workspace = true
fabric-cli-context.workspace = true
fabric-cli-output.workspace = true
fabric-cli-query.workspace = true
fabric-cli-jobs.workspace = true
fabric-cli-local.workspace = true
fabric-cli-mutations.workspace = true
fabric-cli-resources.workspace = true
fabric-cli-transfer.workspace = true
fabric-cli-tables.workspace = true
fabric-cli-storage-files.workspace = true
fabric-deploy.workspace = true
fabric-sdk-api.workspace = true
fabric-sdk-catalog.workspace = true
fabric-sdk-search.workspace = true
fabric-sdk-relevance.workspace = true
fabric-sdk-onelake.workspace = true
fabric-sdk-onelake-http.workspace = true
fabric-sdk.workspace = true
fabric-sdk-discovery = { workspace = true, optional = true }
fabric-sdk-jobs.workspace = true
fabric-sdk-graph = { workspace = true, optional = true }
fabric-sdk-operations.workspace = true
fabric-sdk-tables.workspace = true
fabric-sdk-dataflow.workspace = true
fabric-sdk-tabular.workspace = true
fabric-sdk-workspaces.workspace = true
fabric-sdk-http = { workspace = true, optional = true }
fabric-sdk-transport = { workspace = true, optional = true }
azure_core.workspace = true
base64.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
fabric-identity = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["signal"] }
thiserror.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
arrow-array.workspace = true
arrow-csv.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
azure_core.workspace = true
fabric-sdk-http.workspace = true
parquet.workspace = true
ring.workspace = true
tokio.workspace = true

[[test]]
name = "runtime_v2"
path = "tests/runtime_v2.rs"
required-features = ["runtime-v2"]

[[test]]
name = "runtime_native_host"
path = "tests/runtime_native_host.rs"
required-features = ["runtime-v2", "native-host"]

[[test]]
name = "graph_refresh_v2"
path = "tests/graph_refresh_v2.rs"
required-features = ["v2-refresh"]

[[test]]
name = "native_runtime_notebook_list"
path = "tests/native_runtime_notebook_list.rs"
required-features = ["runtime-v2"]

[[test]]
name = "native_runtime_notebook_list_host"
path = "tests/native_runtime_notebook_list_host.rs"
required-features = ["runtime-v2", "native-host"]

[lints]
workspace = true
