[package]
name = "fabric-cli-v2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Additive grouped local host for Fabric CLI v2"

[package.metadata.fabric]
layer = "cli"

[[bin]]
name = "fab-cli"
path = "src/main.rs"

[features]
default = []
windows-broker = ["dep:fabric-cli", "fabric-cli/windows-broker", "dep:fabric-identity", "fabric-identity/windows-broker", "dep:tokio"]
self-update = ["dep:fabric-cli-update", "fabric-cli-update/bounded-helper", "dep:fabric-sdk-transport", "fabric-sdk-transport/hyper-rustls", "dep:azure_core", "dep:ring", "dep:tokio", "dep:futures-util"]

[dependencies]
fabric-sdk-sql-definition.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
semver.workspace = true
futures-util = { workspace = true, optional = true }
fabric-cli-output.workspace = true
fabric-cli = { workspace = true, optional = true }
fabric-identity = { workspace = true, optional = true }
fabric-cli-update = { workspace = true, optional = true }
fabric-sdk-transport = { workspace = true, optional = true }
azure_core = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["signal"] }

[lints]
workspace = true
