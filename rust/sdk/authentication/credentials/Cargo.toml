[package]
name = "fabric-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Explicit identity composition boundary for the Fabric Rust CLI"

[package.metadata.fabric]
layer = "identity"

[features]
default = []
interactive = ["dep:azure_core", "dep:async-trait", "dep:tokio", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:base64", "dep:keyring", "dep:ring", "dep:secret-service", "dep:security-framework", "dep:zbus"]
windows-broker = ["dep:fabric-identity-windows", "dep:azure_core", "dep:async-trait", "dep:tokio"]
headless = ["dep:azure_identity", "dep:azure_core", "dep:async-trait", "dep:tokio", "dep:serde_json", "dep:thiserror", "dep:rustix"]
certificate-store-windows = ["headless", "dep:fabric-identity-windows", "fabric-identity-windows/certificate-store"]
certificate-store-pkcs11 = ["headless", "dep:ring", "dep:cryptoki", "dep:x509-parser"]
certificate-store-macos = ["headless", "dep:ring", "dep:base64", "dep:serde", "dep:security-framework", "dep:core-foundation", "dep:x509-parser", "tokio/process"]

[[bin]]
name = "fabric-keychain-helper"
path = "src/bin/keychain_helper.rs"
required-features = ["certificate-store-macos"]

[[bin]]
name = "fabric-protected-store-helper"
path = "src/bin/protected_store_helper.rs"
required-features = ["interactive"]

[[test]]
name = "protected_store_helper"
required-features = ["interactive"]

[dependencies]
fabric-core.workspace = true
azure_identity = { workspace = true, optional = true }
azure_core = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true, optional = true }
core-foundation = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }
cryptoki = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
fabric-identity-windows = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
