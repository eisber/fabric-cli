[package]
name = "fabric-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded Fabric read-command composition with caller-owned dependencies"
default-run = "fab-rs"

[package.metadata.fabric]
layer = "cli"

[[bin]]
name = "fab-rs"
path = "src/main.rs"

[[test]]
name = "definition_copy_v2"
path = "tests/definition_copy_v2.rs"
required-features = ["native-host", "v2-copy"]

[[bin]]
name = "fab-cli"
path = "src/bin/fab_cli.rs"
required-features = ["v2-discovery"]

[features]
default = []
v2-cancel = []
v2-copy = []
v2-discovery = ["dep:fabric-sdk-discovery"]
repl = ["dep:fabric-cli-repl", "fabric-cli-repl/reedline-editor"]
windows-broker = ["dep:fabric-identity", "dep:tokio", "fabric-identity/windows-broker"]
native-host = ["dep:fabric-identity", "dep:tokio", "dep:fabric-sdk-http", "dep:fabric-sdk-transport", "fabric-sdk-transport/hyper-rustls", "dep:rustix", "dep:chrono"]
native-read = ["native-host", "windows-broker"]
headless = ["native-host", "fabric-identity/headless"]
certificate-store-windows = ["headless", "fabric-identity/certificate-store-windows"]
self-update = ["dep:fabric-cli-update", "fabric-cli-update/bounded-helper", "dep:ring", "dep:tokio", "dep:fabric-sdk-transport", "fabric-sdk-transport/hyper-rustls"]

[dependencies]
chrono = { workspace = true, optional = true }
fabric-cli-repl = { workspace = true, optional = true }
fabric-cli-update = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
clap.workspace = true
fabric-cli-context.workspace = true
fabric-cli-output.workspace = true
fabric-cli-query.workspace = true
fabric-cli-jobs.workspace = true
fabric-cli-local.workspace = true
fabric-cli-mutations.workspace = true
fabric-cli-resources.workspace = true
fabric-cli-transfer.workspace = true
fabric-cli-tables.workspace = true
fabric-cli-storage-files.workspace = true
fabric-deploy.workspace = true
fabric-sdk-api.workspace = true
fabric-sdk-onelake.workspace = true
fabric-sdk-onelake-http.workspace = true
fabric-sdk.workspace = true
fabric-sdk-discovery = { workspace = true, optional = true }
fabric-sdk-jobs.workspace = true
fabric-sdk-operations.workspace = true
fabric-sdk-tables.workspace = true
fabric-sdk-workspaces.workspace = true
fabric-sdk-http = { workspace = true, optional = true }
fabric-sdk-transport = { workspace = true, optional = true }
azure_core.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
fabric-identity = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["signal"] }
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
azure_core.workspace = true
fabric-sdk-http.workspace = true
tokio.workspace = true

[lints]
workspace = true
