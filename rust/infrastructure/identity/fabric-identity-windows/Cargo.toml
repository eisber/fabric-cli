[package]
name = "fabric-identity-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Isolated Windows desktop broker interop with a safe Rust API"

[package.metadata.fabric]
layer = "identity"

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-future.workspace = true

# Only the private native module may override deny; other crates inherit forbid.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "deny"
