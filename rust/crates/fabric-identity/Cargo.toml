[package]
name = "fabric-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Explicit identity composition boundary for the Fabric Rust CLI"

[package.metadata.fabric]
layer = "identity"

[features]
default = []
windows-broker = ["dep:fabric-identity-windows"]

[dependencies]
fabric-core.workspace = true

[target.'cfg(windows)'.dependencies]
fabric-identity-windows = { workspace = true, optional = true }

[lints]
workspace = true
