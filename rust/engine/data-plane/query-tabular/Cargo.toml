[package]
name = "fabric-sdk-query-tabular"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded native query results to shared typed Arrow tables"

[package.metadata.fabric]
layer = "sdk"

[features]
default = []
aihub = ["dep:base64", "dep:fabric-sdk-aihub-query", "dep:serde"]

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
base64 = { workspace = true, optional = true }
chrono.workspace = true
fabric-sdk-aihub-query = { workspace = true, optional = true }
fabric-sdk-query.workspace = true
fabric-sdk-tabular.workspace = true
serde = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
azure_core.workspace = true
bytes.workspace = true
fabric-v2-contracts.workspace = true
parquet.workspace = true

[[test]]
name = "aihub"
path = "tests/aihub/contracts.rs"
required-features = ["aihub"]

[[example]]
name = "typed_aihub"
path = "examples/aihub/typed_consumer.rs"
required-features = ["aihub"]

[lints]
workspace = true
