[package]
name = "fabric-docs-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Offline Fabric documentation search over an immutable embedded Tantivy index"

[package.metadata.fabric]
layer = "sdk"

[features]
default = []
index-builder = ["tantivy/mmap", "dep:pulldown-cmark", "dep:yaml-rust2", "dep:clap", "dep:ring"]

[dependencies]
tantivy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
pulldown-cmark = { workspace = true, optional = true }
yaml-rust2 = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
ring = { workspace = true, optional = true }

[build-dependencies]
serde_json.workspace = true
ring.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "build-docs-index"
path = "src/bin/build_docs_index.rs"
required-features = ["index-builder"]

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"

[[test]]
name = "ingestion"
path = "tests/ingestion.rs"
required-features = ["index-builder"]

[lints]
workspace = true
