[package]
name = "fabric-sdk-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared bounded HTTP execution for handwritten Fabric SDK operations"

[[test]]
name = "notebook_workload"
required-features = ["notebook-workload"]

[package.metadata.fabric]
layer = "sdk"

[features]
default = []
livy-arrow = ["fabric-sdk/livy-arrow"]
notebook-workload = ["fabric-core/verified-principal", "dep:chrono", "dep:serde"]

[dependencies]
azure_core.workspace = true
fabric-sdk.workspace = true
fabric-sdk-items.workspace = true
fabric-sdk-folders.workspace = true
fabric-sdk-operations.workspace = true
fabric-sdk-workspaces.workspace = true
futures-util.workspace = true
fabric-core.workspace = true
serde_json.workspace = true
chrono = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
fabric-core.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64.workspace = true
ring.workspace = true

[lints]
workspace = true
