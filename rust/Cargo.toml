[workspace]
members = [
    "clients/cli/app",
    "clients/cli/commands/access",
    "clients/cli/commands/api",
    "clients/cli/commands/catalog",
    "clients/cli/commands/contracts",
    "clients/cli/commands/jobs",
    "clients/cli/commands/local",
    "clients/cli/commands/resources",
    "clients/cli/compatibility/resource-commands",
    "clients/cli/commands/onelake/files",
    "clients/cli/commands/onelake/tables",
    "clients/cli/commands/resources/definitions",
    "clients/cli/output",
    "clients/cli/query",
    "clients/cli/repl",
    "clients/cli/state",
    "clients/cli/self-updater",
    "engine/control-plane/acl",
    "engine/control-plane/catalog",
    "engine/control-plane/deployment",
    "engine/control-plane/jobs",
    "engine/control-plane/resources/capacities",
    "engine/control-plane/resources/contracts",
    "engine/control-plane/resources/folders",
    "engine/control-plane/resources/items",
    "engine/control-plane/resources/items/notebooks",
    "engine/control-plane/resources/workspaces",
    "engine/core/auth/provider",
    "engine/core/auth/windows",
    "engine/core/contracts",
    "engine/core/http/executor",
    "engine/core/http/requests",
    "engine/core/http/transport",
    "engine/core/json",
    "engine/core/lro",
    "engine/core/pagination",
    "engine/data-plane/onelake/client",
    "engine/data-plane/onelake/http",
    "engine/data-plane/onelake/tables",
    "engine/sdk",
]
default-members = [
    "clients/cli/commands/access",
    "clients/cli/commands/api",
    "clients/cli/commands/catalog",
    "clients/cli/commands/contracts",
    "clients/cli/self-updater",
    "clients/cli/repl",
    "engine/core/contracts",
    "engine/core/json",
    "engine/core/auth/provider",
    "engine/sdk",
    "engine/control-plane/resources/contracts",
    "engine/control-plane/resources/items/notebooks",
    "engine/control-plane/resources/workspaces",
    "engine/control-plane/resources/items",
    "engine/control-plane/resources/capacities",
    "engine/control-plane/resources/folders",
    "engine/data-plane/onelake/client",
    "engine/data-plane/onelake/http",
    "engine/core/lro",
    "engine/core/http/executor",
    "engine/core/http/transport",
    "engine/control-plane/deployment",
    "clients/cli/app",
    "clients/cli/output",
    "clients/cli/state",
    "clients/cli/query",
    "engine/control-plane/jobs",
    "clients/cli/commands/jobs",
    "engine/core/pagination",
    "clients/cli/commands/resources",
    "engine/core/http/requests",
    "engine/control-plane/acl",
    "engine/control-plane/catalog",
    "clients/cli/compatibility/resource-commands",
    "clients/cli/commands/onelake/files",
    "clients/cli/commands/local",
    "clients/cli/commands/resources/definitions",
    "clients/cli/commands/onelake/tables",
    "engine/data-plane/onelake/tables",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
fabric-cli-access = { path = "clients/cli/commands/access" }
fabric-cli-api = { path = "clients/cli/commands/api" }
fabric-cli-catalog = { path = "clients/cli/commands/catalog" }
fabric-cli-command-contracts = { path = "clients/cli/commands/contracts" }
fabric-cli-repl = { path = "clients/cli/repl", default-features = false }
fabric-cli-update = { path = "clients/cli/self-updater", default-features = false }
reedline = { version = "=0.52.1", default-features = false }
fabric-cli-context = { path = "clients/cli/state" }
fabric-core = { path = "engine/core/contracts" }
fabric-core-json = { path = "engine/core/json" }
fabric-identity = { path = "engine/core/auth/provider" }
fabric-cli-output = { path = "clients/cli/output" }
fabric-cli-query = { path = "clients/cli/query" }
fabric-cli-jobs = { path = "clients/cli/commands/jobs" }
fabric-sdk-jobs = { path = "engine/control-plane/jobs" }
fabric-sdk-paging = { path = "engine/core/pagination" }
fabric-cli-mutations = { path = "clients/cli/commands/resources" }
fabric-sdk-api = { path = "engine/core/http/requests" }
fabric-sdk-access = { path = "engine/control-plane/acl" }
fabric-sdk-catalog = { path = "engine/control-plane/catalog" }
fabric-cli-resources = { path = "clients/cli/compatibility/resource-commands" }
fabric-cli-storage-files = { path = "clients/cli/commands/onelake/files" }
fabric-cli-local = { path = "clients/cli/commands/local" }
fabric-cli-transfer = { path = "clients/cli/commands/resources/definitions" }
fabric-cli-tables = { path = "clients/cli/commands/onelake/tables" }
fabric-sdk-tables = { path = "engine/data-plane/onelake/tables" }
fabric-deploy = { path = "engine/control-plane/deployment" }
fabric-sdk = { path = "engine/sdk" }
fabric-sdk-resource-contracts = { path = "engine/control-plane/resources/contracts" }
fabric-sdk-notebooks = { path = "engine/control-plane/resources/items/notebooks" }
fabric-sdk-workspaces = { path = "engine/control-plane/resources/workspaces" }
fabric-sdk-items = { path = "engine/control-plane/resources/items" }
fabric-sdk-capacities = { path = "engine/control-plane/resources/capacities" }
fabric-sdk-folders = { path = "engine/control-plane/resources/folders" }
fabric-sdk-onelake = { path = "engine/data-plane/onelake/client" }
fabric-sdk-onelake-http = { path = "engine/data-plane/onelake/http" }
fabric-sdk-operations = { path = "engine/core/lro" }
fabric-sdk-http = { path = "engine/core/http/executor" }
fabric-sdk-transport = { path = "engine/core/http/transport", default-features = false }
fabric-identity-windows = { path = "engine/core/auth/windows" }
azure_core = { version = "1.1.0", default-features = false }
azure_identity = { version = "=1.0.0", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
semver = { version = "=1.0.28", default-features = false, features = ["std"] }
base64 = "0.22.1"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
secret-service = { version = "=4.0.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
security-framework = { version = "=3.7.0", default-features = false }
core-foundation = { version = "=0.10.1", default-features = false }
zbus = { version = "=4.4.0", default-features = false, features = ["tokio"] }
cryptoki = { version = "=0.12.1", default-features = false }
x509-parser = { version = "=0.18.1", default-features = false }
yaml-rust2 = { version = "=0.10.4", default-features = false }
fancy-regex = { version = "=0.16.2", default-features = false, features = ["std", "unicode"] }
jsonpath-rust = { version = "=0.7.5", default-features = false }
async-trait = "0.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs"] }
icu_properties = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
serde = { version = "1.0.229", features = ["derive"] }
# CLI output preserves Python dictionary order and finite-float parsing fidelity.
# These features intentionally unify across every workspace JSON consumer.
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2.0.21"
jpx-core = { version = "=0.3.1", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "time", "net", "io-util", "sync"] }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-legacy", "client-proxy", "http1", "tokio"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "ring", "tls12"] }
hyper-timeout = { version = "=0.5.2", default-features = false }
http = { version = "=1.5.0", default-features = false, features = ["std"] }
http-body-util = { version = "=0.1.5", default-features = false }
tower-service = { version = "=0.3.3", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-platform-verifier = { version = "=0.7.1", default-features = false }
rustls-native-certs = { version = "=0.8.5", default-features = false }
async-compression = { version = "=0.4.51", default-features = false, features = ["tokio", "gzip", "zlib"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["io"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
windows = { version = "=0.62.2", default-features = false, features = ["std", "Security_Authentication_Web_Core", "Security_Credentials", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography"] }
windows-future = { version = "=0.3.2", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = "warn"
