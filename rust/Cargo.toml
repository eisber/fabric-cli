[workspace]
members = ["crates/*"]
default-members = [
    "crates/fabric-core",
    "crates/fabric-identity",
    "crates/fabric-sdk",
    "crates/fabric-sdk-workspaces",
    "crates/fabric-sdk-http",
    "crates/fabric-deploy",
    "crates/fabric-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
fabric-core = { path = "crates/fabric-core" }
fabric-sdk = { path = "crates/fabric-sdk" }
fabric-sdk-workspaces = { path = "crates/fabric-sdk-workspaces" }
fabric-sdk-http = { path = "crates/fabric-sdk-http" }
fabric-identity-windows = { path = "crates/fabric-identity-windows" }
azure_core = { version = "1.1.0", default-features = false }
base64 = "0.22.1"
async-trait = "0.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt"] }
windows = { version = "=0.62.2", default-features = false, features = ["std", "Security_Authentication_Web_Core", "Security_Credentials", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
windows-future = { version = "=0.3.2", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = "warn"
