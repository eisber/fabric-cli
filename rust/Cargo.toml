[workspace]
members = [
    "crates/fabric-core",
    "crates/fabric-identity",
    "crates/fabric-sdk",
    "crates/fabric-deploy",
    "crates/fabric-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
fabric-core = { path = "crates/fabric-core" }
azure_core = { version = "1.1.0", default-features = false }
async-trait = "0.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = "warn"
