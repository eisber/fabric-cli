name: Rust native validation

on:
  workflow_call:
    inputs:
      preview:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install exact pinned toolchain (unavailable is a failure, never a downgrade)
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target "$TARGET"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target/debug
            rust/target/release
            rust/target/${{ matrix.target }}
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-1.99.1-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/*.rs') }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-1.99.1-${{ hashFiles('rust/Cargo.lock') }}-
      - name: Verify native host, target and compiler; record fresh evidence
        run: python scripts/native_host.py --target "$TARGET" --output "target/native-evidence.json"
      - name: Lightweight script tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Restore locked dependencies
        run: cargo fetch --locked
      - name: Offline dependency boundaries (normal, build, and dev graph)
        run: python scripts/check_boundaries.py
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --offline --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --offline --locked --workspace --all-targets -- -D warnings
      - name: Offline workspace tests
        run: cargo test --offline --locked --workspace
      - name: Documentation tests
        run: cargo test --offline --locked --workspace --doc
      - name: Public documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --offline --locked --workspace --no-deps
      - name: Executable metadata
        run: |
          cargo run --offline --locked -p fabric-cli -- --help
          cargo run --offline --locked -p fabric-cli -- --version
      - name: Native release binary
        run: cargo build --offline --locked --release -p fabric-cli --bin fab-rs --target "$TARGET"
      - name: Package minimal unsigned preview, notices, SBOM, checksums and provenance
        run: python scripts/package_native.py build --target "$TARGET" --output "target/preview-$TARGET"
      - name: Verify and smoke the exact archived bytes without Azure CLI
        run: python scripts/package_native.py verify --target "$TARGET" --directory "target/preview-$TARGET" --smoke
      - name: Retain native evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-native-evidence-${{ matrix.target }}
          path: rust/target/native-evidence.json
          if-no-files-found: warn
      - name: Upload UNSIGNED UNOFFICIAL preview (not a release)
        if: ${{ inputs.preview }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UNSIGNED-UNOFFICIAL-fab-rs-${{ matrix.target }}
          path: rust/target/preview-${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 7
