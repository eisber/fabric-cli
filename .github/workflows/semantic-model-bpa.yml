name: Optional semantic-model BPA

on:
  pull_request:
    paths:
      - ".github/workflows/semantic-model-bpa.yml"
      - "rust/sdk/semantic-model/**"
      - "rust/frontends/cli/commands/semantic-model/**"
      - "rust/frontends/cli/app/**"
      - "rust/sdk/client/**"
      - "rust/tests/**/semantic_model_bpa/**"
      - "rust/scripts/generate_bpa_rule_catalog.py"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/NuGet.Config"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tom:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "8.0.425"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Pin Rust and explicit runtime location
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          $fxr = Get-ChildItem "$env:DOTNET_ROOT/host/fxr" -Directory |
            Where-Object Name -Like '8.*' | Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $fxr) { throw 'The explicitly installed .NET 8 host is missing.' }
          "FABRIC_BPA_TEST_HOSTFXR=$($fxr.FullName)/hostfxr.dll" >> $env:GITHUB_ENV
      - name: Independent pinned-source acceptance
        run: |
          python -B rust/scripts/generate_bpa_rule_catalog.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -m unittest discover -s rust/tests/compatibility/semantic_model_bpa -p test_oracle.py -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Record source hashes before managed acceptance
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/semantic-source-integrity" | Out-Null
          node -e 'const fs=require("node:fs"),path=require("node:path"),v=require("./rust/scripts/validate-impact.cjs"); fs.writeFileSync(path.join(process.env.RUNNER_TEMP,"semantic-source-integrity","before.json"), JSON.stringify(v.sourceInventory(process.cwd()),null,2));'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Managed rule and ABI acceptance
        run: |
          node rust/scripts/managed-bpa-acceptance.cjs "$env:RUNNER_TEMP/semantic-managed-acceptance"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native default and optional host contracts
        working-directory: rust
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-sdk-semantic-model -p fabric-cli-semantic-model -p fabric-semantic-model-dotnet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --offline --locked -p fabric-sdk-semantic-model -p fabric-cli-semantic-model -p fabric-semantic-model-dotnet --all-targets --features fabric-sdk-semantic-model/dotnet,fabric-cli-semantic-model/dotnet,fabric-semantic-model-dotnet/dotnet -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-semantic-model-dotnet --features dotnet --test bindings_contract --test bindings_hosted
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-cli --features semantic-model --test semantic_model_mount --test workspace_contract
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-cli --features semantic-model-dotnet --test semantic_model_mount
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-cli --features semantic-model,self-update --bin fab-rs offline_bpa_is_excluded_before_update_policy_or_transport_setup
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify source hashes after managed acceptance
        if: always()
        run: |
          node -e 'const fs=require("node:fs"),path=require("node:path"),v=require("./rust/scripts/validate-impact.cjs"); const dir=path.join(process.env.RUNNER_TEMP,"semantic-source-integrity"); fs.mkdirSync(dir,{recursive:true}); const after=v.sourceInventory(process.cwd()); fs.writeFileSync(path.join(dir,"after.json"),JSON.stringify(after,null,2)); const beforePath=path.join(dir,"before.json"); if(!fs.existsSync(beforePath)) throw new Error("Before-source inventory is missing"); const before=JSON.parse(fs.readFileSync(beforePath,"utf8")); const a=new Map(before.files.map(f=>[f.path,f])),b=new Map(after.files.map(f=>[f.path,f])); const changed=[...new Set([...a.keys(),...b.keys()])].sort().filter(p=>JSON.stringify(a.get(p))!==JSON.stringify(b.get(p))).map(p=>({path:p,before:a.get(p)||null,after:b.get(p)||null})); fs.writeFileSync(path.join(dir,"changes.json"),JSON.stringify(changed,null,2)); if(before.digest!==after.digest) throw new Error("Source changed during managed acceptance; inspect changes.json");'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain source-integrity diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: semantic-source-integrity
          path: ${{ runner.temp }}/semantic-source-integrity
          if-no-files-found: error
          retention-days: 7
      - name: Retain isolated managed acceptance logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: semantic-managed-acceptance
          path: |
            ${{ runner.temp }}/semantic-managed-acceptance/commands.json
            ${{ runner.temp }}/semantic-managed-acceptance/*.log
            ${{ runner.temp }}/semantic-managed-acceptance/Directory.Build.props
            ${{ runner.temp }}/semantic-managed-acceptance/global.json
          if-no-files-found: error
          retention-days: 7
