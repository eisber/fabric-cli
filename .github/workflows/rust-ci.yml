name: Rust scaffold

on:
  pull_request:
  push:
    branches: [main, feature/rust, dev/marcozo/fab-cli-v2-integration-20261104]
  merge_group:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      scope:
        description: Full validation, or affected validation from an explicit real base SHA
        type: choice
        options: [full, affected]
        default: full
      base:
        description: Full 40-character base commit SHA for affected validation (otherwise full)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/dev/marcozo/fab-cli-v2-integration-20261104' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select dependency impact
    if: >-
      !((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev/marcozo/fab-cli-v2-integration-20261104') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev/marcozo/fab-cli-v2-integration-20261104'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      run_native: ${{ steps.select.outputs.run_native }}
      matrix: ${{ steps.select.outputs.matrix }}
      native_pools: ${{ steps.select.outputs.native_pools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up source-plan Python
        timeout-minutes: 2
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test impact graph, executor and existing preflight contracts
        run: >-
          node --test rust/scripts/impact-plan.test.cjs
          rust/scripts/validate-impact.test.cjs
          rust/scripts/execution-evidence.test.cjs
          rust/scripts/validation-checks.test.cjs
          rust/scripts/rust-fast-check.test.cjs
          rust/scripts/rust-coverage.test.cjs
          rust/scripts/impact-shards.test.cjs
          rust/scripts/impact-ci.test.cjs
          rust/scripts/impact-cache.test.cjs
      - name: Test exact engineering preflight receipt helper
        run: python -I -B -m unittest discover -s rust/scripts -p test_engineering_preflight.py -v
      - name: Select capability targets, Cargo consumers and feature contracts
        id: select
        env:
          IMPACT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          IMPACT_SCOPE: ${{ inputs.scope }}
          IMPACT_DISPATCH_BASE: ${{ inputs.base }}
        run: node rust/scripts/impact-ci.cjs select "$RUNNER_TEMP/rust-impact-selection"
      - name: Retain explainable selection and immutable request
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-impact-selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-impact-selection
          if-no-files-found: error

  native:
    name: Native pool (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.run_native == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.changes.outputs.native_pools) }}
    uses: ./.github/workflows/rust-native-shard.yml
    with:
      platform: ${{ matrix.platform }}
      matrix: ${{ toJSON(matrix.shards) }}

  validation:
    name: Rust validation
    if: >-
      always() &&
      !((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev/marcozo/fab-cli-v2-integration-20261104') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev/marcozo/fab-cli-v2-integration-20261104'))
    needs: [changes, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SELECTION_RESULT: ${{ needs.changes.result }}
      RUN_NATIVE: ${{ needs.changes.outputs.run_native }}
      NATIVE_RESULT: ${{ needs.native.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up aggregation Python
        if: needs.changes.result == 'success'
        timeout-minutes: 2
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Restore source-bound selection
        if: needs.changes.result == 'success'
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rust-impact-selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-impact-selection
      - name: Download every small native receipt
        if: needs.changes.outputs.run_native == 'true'
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # A partial rerun must fail closed instead of reusing prior receipts.
          pattern: rust-receipt-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/rust-native-receipts
      - name: Require successful selection and every selected native check
        if: always()
        shell: bash
        run: |
          if [[ "$SELECTION_RESULT" != success ]]; then
            echo "::error::Dependency impact selection did not succeed."
            exit 1
          fi
          node rust/scripts/impact-ci.cjs aggregate "$RUNNER_TEMP/rust-impact-selection" "$RUNNER_TEMP/rust-native-receipts"
      - name: Retain aggregate proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-validation-aggregate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-impact-selection/aggregate.json
          if-no-files-found: warn
