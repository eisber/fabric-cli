name: Rust scaffold

on:
  pull_request:
  push:
    branches: [main, feature/rust, dev/marcozo/fab-cli-v2-integration-20261104]
  merge_group:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/dev/marcozo/fab-cli-v2-integration-20261104' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select dependency impact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      run_native: ${{ steps.select.outputs.run_native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test impact graph, executor and existing preflight contracts
        run: >-
          node --test rust/scripts/impact-plan.test.cjs
          rust/scripts/validate-impact.test.cjs
          rust/scripts/validation-checks.test.cjs
          rust/scripts/rust-fast-check.test.cjs
          rust/scripts/rust-coverage.test.cjs
      - name: Select capability targets, Cargo consumers and feature contracts
        id: select
        env:
          IMPACT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node rust/scripts/impact-ci.cjs select "$RUNNER_TEMP/rust-impact-selection"
      - name: Retain explainable selection and immutable request
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-impact-selection
          path: ${{ runner.temp }}/rust-impact-selection
          if-no-files-found: error

  native:
    name: Native checks (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run_native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RUST_TEST_THREADS: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore selection request
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rust-impact-selection
          path: ${{ runner.temp }}/rust-impact-selection
      - name: Set up development-only Python oracle
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Record actual native toolchain and restore locked dependencies
        working-directory: rust
        run: |
          cargo --version
          rustc --version --verbose
          rustup show active-toolchain
          cargo fetch --locked
      - name: Recompute and verify the same dependency selection on this host
        run: node rust/scripts/impact-ci.cjs native "$RUNNER_TEMP/rust-impact-selection"
      - name: Check bounded engineering cleanup before native compilation
        run: |
          python -I -B - "$GITHUB_WORKSPACE/rust/scripts" "$RUNNER_TEMP/rust-engineering-unit" <<'PY'
          import json
          import os
          import pathlib
          import platform
          import sys
          import unittest
          from unittest.mock import patch

          source = pathlib.Path(sys.argv[1]).resolve()
          artifacts = pathlib.Path(sys.argv[2]).resolve()
          artifacts.mkdir(parents=True, exist_ok=False)
          os.chdir(artifacts)
          report = {"kind": "engineering-unit-preflight", "head": os.environ["GITHUB_SHA"],
                    "host": platform.system(), "suites": [], "pty_receipts": [], "passed": False}
          def persist():
              pathlib.Path("receipt.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
              print(json.dumps(report))
          persist()
          pattern, count = "test_native_acceptance*.py", 38
          suite = unittest.defaultTestLoader.discover(str(source), pattern=pattern)
          discovered = suite.countTestCases()
          if discovered != count:
              report["suites"].append({"pattern": pattern, "expected": count,
                                       "discovered": discovered, "run": 0,
                                       "passed": False, "reason": "inventory_mismatch"})
              persist()
              raise SystemExit(1)
          import native_acceptance as acceptance
          original_execute = acceptance.execute
          def observe_execute(*args, **kwargs):
              captured = original_execute(*args, **kwargs)
              if kwargs.get("terminal") is not None:
                  report["pty_receipts"].append(captured[0])
              return captured
          with open("native-acceptance.log", "w", encoding="utf-8") as log:
              with patch.object(acceptance, "execute", observe_execute):
                  result = unittest.TextTestRunner(stream=log, verbosity=2).run(suite)
          skips = [(test.id(), reason) for test, reason in result.skipped]
          expected = [("test_native_acceptance.FilesystemTests.test_raw_pty_cursor_flood_without_input_reads_is_bounded_and_reaped",
                       "requires_native_POSIX_PTY")] if os.name == "nt" else []
          success = result.wasSuccessful() and result.testsRun == count and not result.expectedFailures and skips == expected
          report["suites"].append({"pattern": pattern, "expected": count,
                                   "discovered": discovered, "run": result.testsRun,
                                   "failures": len(result.failures), "errors": len(result.errors),
                                   "expected_failures": len(result.expectedFailures),
                                   "skipped": skips, "passed": success})
          report["passed"] = success
          persist()
          raise SystemExit(0 if success else 1)
          PY
      - name: Preflight every current feature and target under strict native lints
        if: success() || failure()
        working-directory: rust
        run: cargo clippy --offline --locked --workspace --all-targets --all-features -- -D warnings
      - name: Exercise complete native CLI targets before the full feature plan
        env:
          FAB_IDENTITY_TEST_ROOT: ${{ runner.temp }}/rust-cli-preflight
          FAB_UPDATE_TEST_ROOT: ${{ runner.temp }}/rust-cli-preflight
          FAB_CLI_V2_TEST_ROOT: ${{ runner.temp }}/rust-cli-preflight
          IMPACT_TEST_ROOT: ${{ runner.temp }}/rust-cli-preflight
        working-directory: rust
        run: |
          mkdir -p "$FAB_IDENTITY_TEST_ROOT"
          cargo test --offline --locked -p fabric-cli --all-targets --all-features --no-fail-fast
      - name: Execute the shared local and CI validation plan
        run: >-
          node rust/scripts/validate-impact.cjs
          --plan "$RUNNER_TEMP/rust-impact-selection/native-plan.json"
          --artifacts "$RUNNER_TEMP/rust-impact-results"
          --restore-oracle-deps --execute
      - name: Retain plan and actual command exits, hashes and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-impact-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/rust-impact-selection
            ${{ runner.temp }}/rust-impact-results
            ${{ runner.temp }}/rust-engineering-unit/*.log
            ${{ runner.temp }}/rust-engineering-unit/receipt.json
            ${{ runner.temp }}/rust-cli-preflight
          if-no-files-found: error

  validation:
    name: Rust validation
    if: always()
    needs: [changes, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SELECTION_RESULT: ${{ needs.changes.result }}
      RUN_NATIVE: ${{ needs.changes.outputs.run_native }}
      NATIVE_RESULT: ${{ needs.native.result }}
    steps:
      - name: Require successful selection and every selected native check
        shell: bash
        run: |
          if [[ "$SELECTION_RESULT" != success ]]; then
            echo "::error::Dependency impact selection did not succeed."
            exit 1
          fi
          if [[ "$RUN_NATIVE" == true && "$NATIVE_RESULT" == success ]]; then
            echo "Selected dependency contracts passed on every native runner."
          elif [[ "$RUN_NATIVE" == false && "$NATIVE_RESULT" == skipped ]]; then
            echo "No Rust build or contract inputs changed."
          else
            echo "::error::Selected native checks did not complete successfully."
            exit 1
          fi
