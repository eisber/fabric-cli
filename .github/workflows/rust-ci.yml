name: Rust scaffold

on:
  pull_request:
  push:
    branches: [main, feature/rust, dev/marcozo/fab-cli-v2-integration-20261104]
  merge_group:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/dev/marcozo/fab-cli-v2-integration-20261104' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select dependency impact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      run_native: ${{ steps.select.outputs.run_native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test impact graph, executor and existing preflight contracts
        run: >-
          node --test rust/scripts/impact-plan.test.cjs
          rust/scripts/validate-impact.test.cjs
          rust/scripts/validation-checks.test.cjs
          rust/scripts/rust-fast-check.test.cjs
      - name: Select capability targets, Cargo consumers and feature contracts
        id: select
        env:
          IMPACT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node rust/scripts/impact-ci.cjs select "$RUNNER_TEMP/rust-impact-selection"
      - name: Retain explainable selection and immutable request
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-impact-selection
          path: ${{ runner.temp }}/rust-impact-selection
          if-no-files-found: error

  native:
    name: Native checks (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run_native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore selection request
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rust-impact-selection
          path: ${{ runner.temp }}/rust-impact-selection
      - name: Set up development-only Python oracle
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Record actual native toolchain and restore locked dependencies
        working-directory: rust
        run: |
          cargo --version
          rustc --version --verbose
          rustup show active-toolchain
          cargo fetch --locked
      - name: Recompute and verify the same dependency selection on this host
        run: node rust/scripts/impact-ci.cjs native "$RUNNER_TEMP/rust-impact-selection"
      - name: Execute the shared local and CI validation plan
        run: >-
          node rust/scripts/validate-impact.cjs
          --plan "$RUNNER_TEMP/rust-impact-selection/native-plan.json"
          --artifacts "$RUNNER_TEMP/rust-impact-results"
          --restore-oracle-deps --execute
      - name: Retain plan and actual command exits, hashes and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-impact-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/rust-impact-selection
            ${{ runner.temp }}/rust-impact-results
          if-no-files-found: error

  validation:
    name: Rust validation
    if: always()
    needs: [changes, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SELECTION_RESULT: ${{ needs.changes.result }}
      RUN_NATIVE: ${{ needs.changes.outputs.run_native }}
      NATIVE_RESULT: ${{ needs.native.result }}
    steps:
      - name: Require successful selection and every selected native check
        shell: bash
        run: |
          if [[ "$SELECTION_RESULT" != success ]]; then
            echo "::error::Dependency impact selection did not succeed."
            exit 1
          fi
          if [[ "$RUN_NATIVE" == true && "$NATIVE_RESULT" == success ]]; then
            echo "Selected dependency contracts passed on every native runner."
          elif [[ "$RUN_NATIVE" == false && "$NATIVE_RESULT" == skipped ]]; then
            echo "No Rust build or contract inputs changed."
          else
            echo "::error::Selected native checks did not complete successfully."
            exit 1
          fi
