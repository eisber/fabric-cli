name: Rust unsigned unofficial preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    uses: ./.github/workflows/rust-native.yml
    with:
      preview: true
    permissions:
      contents: read
