name: Diagnose managed source integrity

on:
  push:
    branches: [dev/marcozo/v2-layout-union-20261107-vigilant]
    paths:
      - ".github/workflows/rust-source-drift.yml"
      - "rust/scripts/source-inventory.cjs"
      - "rust/scripts/validate-impact.cjs"
      - "rust/sdk/semantic-model/dotnet/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-build:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "8.0.425"
      - name: Restore existing pinned native dependencies
        working-directory: rust
        run: cargo fetch --locked
      - name: Record exact source bytes before the optional build
        run: node rust/scripts/source-inventory.cjs "$env:RUNNER_TEMP/source-drift/before.json"
      - name: Execute the smallest optional managed build
        working-directory: rust
        run: cargo check --offline --locked -p fabric-semantic-model-dotnet --features dotnet --all-targets
      - name: Record exact source differences without waiving the guard
        if: always()
        run: node rust/scripts/source-inventory.cjs "$env:RUNNER_TEMP/source-drift/after.json" "$env:RUNNER_TEMP/source-drift/before.json"
      - name: Retain the immutable per-file diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: managed-source-drift
          path: ${{ runner.temp }}/source-drift
          if-no-files-found: error
