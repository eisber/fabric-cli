              'rust/clients/cli/app/tests/execute_arguments.rs',
              'rust/clients/cli/app/tests/execute_cli_contract.rs',
              'rust/clients/cli/app/tests/parser_support/mod.rs',
              'rust/engine/sdk/Cargo.toml',
              'rust/engine/sdk/src/lib.rs',
              'rust/engine/sdk/src/dataflow_queries.rs',
              'rust/engine/sdk/tests/dataflow_queries.rs',
            ].map(file => [file, sha256(fs.readFileSync(path.join(root, file)))]));
            before = sourceInventory(root);
            fs.writeFileSync(path.join(artifacts, 'source-before.json'), JSON.stringify(before, null, 2));
            const test = ['test', '--offline', '--locked'];
            report.plan = [
              {id: 'sdk', args: [...test, '-p', 'fabric-sdk-dataflow', '--test', 'diagnostics', '--test', 'execute_query',
