          const {registeredTests} = require('./rust/scripts/integration-update-smoke.cjs');
          const {testObservations} = require('./rust/scripts/integration-dataagent-smoke.cjs');
          const root = fs.realpathSync(process.cwd());
          const rust = path.join(root, 'rust');
          const artifacts = path.join(process.env.RUNNER_TEMP, 'integration-smoke-receipts', 'dataflow-enhancements');
          fs.mkdirSync(artifacts, {recursive: false});
          const started = Date.now(), deadline = started + 570000;
          const source = '81685ace547574fc29a7564cb04e20b34c935d59';
          const base = 'af846fe7e3ea444051aae3881491078323527d5f';
          const sha256 = value => crypto.createHash('sha256').update(value).digest('hex');
          const prefixed = (file, prefix = '') => registeredTests(file).map(name => `${prefix}${name}`);
          const report = {
