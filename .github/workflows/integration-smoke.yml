name: Provisional integration smoke

on:
  pull_request:
    branches: [dev/marcozo/fab-cli-v2-integration-20261104]
  push:
    branches: [dev/marcozo/fab-cli-v2-integration-20261104]

permissions:
  contents: read

concurrency:
  group: integration-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Integration smoke (Windows, provisional)
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev/marcozo/fab-cli-v2-integration-20261104') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev/marcozo/fab-cli-v2-integration-20261104')
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Record the KQL candidate's first workflow-step time
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'dev/marcozo/integrate-kql-shortcut-links-pr55-end-to-tomz4t'
        run: |
          @'
          const fs = require('node:fs');
          const path = require('node:path');
          const recorded = Date.now();
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'kql-link-first-step-anchor.json'),
            JSON.stringify({
              schema: 1, kind: 'estimated-first-workflow-step', recorded_unix_ms: recorded,
              repository: process.env.GITHUB_REPOSITORY, run_id: process.env.GITHUB_RUN_ID,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT, source: event.pull_request.head.sha,
              base: event.pull_request.base.sha, candidate: event.pull_request.head.ref,
              checkout: process.env.GITHUB_SHA,
              original_source: 'e1baaee16dc6eb4917c5310224c27fcd258564ef',
            }) + '\n', {flag: 'wx'});
          '@ | node
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test smoke and routing contracts without native compilation
        run: >-
          node --test rust/scripts/integration-smoke.test.cjs rust/scripts/integration-notebook-smoke.test.cjs rust/scripts/integration-http-cli57-smoke.test.cjs
          rust/scripts/integration-ocv-smoke.test.cjs
          rust/scripts/integration-update-smoke.test.cjs
          rust/scripts/integration-dataagent-smoke.test.cjs
          rust/scripts/integration-dataagent-link-smoke.test.cjs
          rust/scripts/integration-kql-link-smoke.test.cjs
          rust/scripts/integration-schema-smoke.test.cjs
          rust/scripts/integration-target-witness.test.cjs
      - name: Independently witness the exact integration target before native work
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node rust/scripts/integration-target-witness.cjs "$env:RUNNER_TEMP/integration-target-witness.json"
      - name: Build two profiles once and exercise isolated offline entry points
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/integration-smoke-target
