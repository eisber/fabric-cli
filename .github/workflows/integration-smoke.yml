                for (const name of item.required) assert.ok(result.stdout.includes(`test ${name} ... ok`), name);
                item.observations = observations;
                item.case_names = [...result.stdout.matchAll(/^test ([^\r\n]+) \.\.\. ok\r?$/gm)].map(value => value[1]);
                item.executables = [...result.stderr.matchAll(/Running [^\r\n]+ \(([^)\r\n]+\.exe)\)/g)].map(value => {
