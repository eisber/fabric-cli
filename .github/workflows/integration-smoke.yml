name: Provisional integration smoke

on:
  pull_request:
    branches: [dev/marcozo/fab-cli-v2-integration-20261104]
  push:
    branches: [dev/marcozo/fab-cli-v2-integration-20261104]

permissions:
  contents: read

concurrency:
  group: integration-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Integration smoke (Windows, provisional)
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev/marcozo/fab-cli-v2-integration-20261104') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev/marcozo/fab-cli-v2-integration-20261104')
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test smoke and routing contracts without native compilation
        run: node --test rust/scripts/integration-smoke.test.cjs
      - name: Build two profiles once and exercise isolated offline entry points
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/integration-smoke-target
        run: node rust/scripts/integration-smoke.cjs "$env:RUNNER_TEMP/integration-smoke-receipts"
      - name: Check the Report66 conflict candidate's optional shared paths offline
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'dev/marcozo/reconcile-and-integrate-native-report-cr-toewpt'
        timeout-minutes: 10
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/integration-smoke-target
          CARGO_PROFILE_TEST_DEBUG: "0"
          RUST_TEST_THREADS: "1"
        shell: pwsh
        run: |
          $receipts = "$env:RUNNER_TEMP/integration-smoke-receipts"
          node rust/scripts/source-inventory.cjs "$receipts/report-create-before.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location rust
          cargo fetch --locked --target x86_64-pc-windows-msvc 2>&1 | Tee-Object "$receipts/report-create-fetch.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-sdk-operations --test standalone --test endpoint_context 2>&1 | Tee-Object "$receipts/report-create-lro.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-sdk-items --test create_policy 2>&1 | Tee-Object "$receipts/report-create-policy.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-sdk --test report_create 2>&1 | Tee-Object "$receipts/report-create-sdk.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-cli --no-default-features --features headless,v2-create,runtime-v2 --test create_host --test v2_create_report --test livy_list_entry 2>&1 | Tee-Object "$receipts/report-create-combined.log"
          exit $LASTEXITCODE
      - name: Verify the optional Report66 check left source unchanged
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'dev/marcozo/reconcile-and-integrate-native-report-cr-toewpt'
        run: >-
          node rust/scripts/source-inventory.cjs
          "$env:RUNNER_TEMP/integration-smoke-receipts/report-create-after.json"
          "$env:RUNNER_TEMP/integration-smoke-receipts/report-create-before.json"
      - name: Check the KQL73 conflict candidate's combined create paths offline
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'dev/marcozo/reconcile-and-integrate-kql-database-cre-toey4y'
        timeout-minutes: 10
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/integration-smoke-target
          CARGO_PROFILE_TEST_DEBUG: "0"
          RUST_TEST_THREADS: "1"
        shell: pwsh
        run: |
          $receipts = "$env:RUNNER_TEMP/integration-smoke-receipts"
          node rust/scripts/source-inventory.cjs "$receipts/kql-create-before.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location rust
          cargo fetch --locked --target x86_64-pc-windows-msvc 2>&1 | Tee-Object "$receipts/kql-create-fetch.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-sdk-operations --test standalone --test endpoint_context 2>&1 | Tee-Object "$receipts/kql-create-lro.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-sdk-items --test create_policy 2>&1 | Tee-Object "$receipts/kql-create-policy.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-sdk --test report_create 2>&1 | Tee-Object "$receipts/kql-create-sdk.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-cli --no-default-features --features headless,v2-kql-database-create,runtime-v2 --test create_host --test kql_database_create --test kql_database_create_binary --test v2_create_report --test livy_list_entry 2>&1 | Tee-Object "$receipts/kql-create-combined.log"
          exit $LASTEXITCODE
      - name: Verify the optional KQL73 check left source unchanged
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'dev/marcozo/reconcile-and-integrate-kql-database-cre-toey4y'
        run: >-
          node rust/scripts/source-inventory.cjs
          "$env:RUNNER_TEMP/integration-smoke-receipts/kql-create-after.json"
          "$env:RUNNER_TEMP/integration-smoke-receipts/kql-create-before.json"
      - name: Check the Eventhouse76 conflict candidate's combined create paths offline
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'dev/marcozo/evaluate-and-integrate-released-eventhou-tof03g'
        timeout-minutes: 10
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/integration-smoke-target
          CARGO_PROFILE_TEST_DEBUG: "0"
          RUST_TEST_THREADS: "1"
        shell: pwsh
        run: |
          $receipts = "$env:RUNNER_TEMP/integration-smoke-receipts"
          node rust/scripts/source-inventory.cjs "$receipts/eventhouse-create-before.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location rust
          cargo fetch --locked --target x86_64-pc-windows-msvc 2>&1 | Tee-Object "$receipts/eventhouse-create-fetch.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-sdk-operations --test standalone --test endpoint_context 2>&1 | Tee-Object "$receipts/eventhouse-create-lro.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-sdk-items --test create_policy 2>&1 | Tee-Object "$receipts/eventhouse-create-policy.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-sdk --test report_create 2>&1 | Tee-Object "$receipts/eventhouse-create-sdk.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-cli --no-default-features --features headless,v2-create-eventhouse,runtime-v2 --test eventhouse_create_binary 2>&1 | Tee-Object "$receipts/eventhouse-create-binary.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-cli --no-default-features --features headless,v2-kql-database-create,runtime-v2 --test kql_database_create_binary 2>&1 | Tee-Object "$receipts/eventhouse-create-kql-binary.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --offline --locked -p fabric-cli --no-default-features --features headless,v2-create-eventhouse,v2-kql-database-create,runtime-v2 --test create_host --test eventhouse_create --test kql_database_create --test create_binding_composition --test v2_create_report --test livy_list_entry 2>&1 | Tee-Object "$receipts/eventhouse-create-combined.log"
          exit $LASTEXITCODE
      - name: Verify the optional Eventhouse76 check left source unchanged
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'dev/marcozo/evaluate-and-integrate-released-eventhou-tof03g'
        run: >-
          node rust/scripts/source-inventory.cjs
          "$env:RUNNER_TEMP/integration-smoke-receipts/eventhouse-create-after.json"
          "$env:RUNNER_TEMP/integration-smoke-receipts/eventhouse-create-before.json"
      - name: Retain actual exits, timings, source pins and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-smoke-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/integration-smoke-receipts
          if-no-files-found: error
          retention-days: 7
