              'rust/engine/data-plane/dataflow/Cargo.toml', 'rust/clients/cli/app/Cargo.toml',
              'rust/engine/data-plane/dataflow/src/diagnostics.rs',
              'rust/engine/data-plane/dataflow/tests/diagnostics.rs',
              'rust/clients/cli/app/src/native_execute_diagnostics.rs',
              'rust/clients/cli/app/src/native_execute_diagnostics_tests.rs',
              'rust/clients/cli/app/src/native_execute_tests.rs',
              'rust/clients/cli/app/src/execute_m.rs',
              'rust/clients/cli/app/src/execute_host.rs',
              'rust/clients/cli/app/src/execute.rs',
              'rust/clients/cli/app/src/native_dataflow_queries.rs',
              'rust/clients/cli/app/src/native_read.rs',
              'rust/clients/cli/app/src/main.rs',
              'rust/clients/cli/app/src/parser.rs',
