              report.passed = false;
              report.integrity_error = error.message;
              process.exitCode = 1;
            } finally {
              report.elapsed_seconds = (Date.now() - started) / 1000;
              report.phase.remaining_after_finalization_milliseconds = deadline - Date.now();
              if (report.phase.remaining_after_finalization_milliseconds <= 0) {
                report.passed = false;
                process.exitCode = 1;
              }
              save();
            }
