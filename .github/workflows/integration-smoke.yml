            }
            save();
          };
          const remaining = () => {
            const value = deadline - Date.now();
            assert.ok(value > 0, 'Finite Dataflow enhancement phase expired');
            return value;
          };
          const run = (file, args, cwd = root) => capture(file, args, {
            cwd, timeout: Math.min(480000, remaining()),
          }, report, persist);
          const git = args => {
            const result = run('git', args);
            assert.equal(result.status, 0, `Git failed: ${JSON.stringify(args)}`);
            return result.stdout.trim();
          };
          let before, active;
          try {
            save();
            assert.equal(process.platform, 'win32');
            assert.equal(process.env.RUNNER_ENVIRONMENT, 'github-hosted');
            assert.equal(process.env.RUNNER_OS, 'Windows');
            assert.equal(process.env.GITHUB_EVENT_NAME, 'pull_request');
            assert.equal(process.env.CARGO_BUILD_JOBS, '2');
            assert.equal(process.env.RUST_TEST_THREADS, '1');
            assert.equal(path.resolve(process.env.CARGO_TARGET_DIR),
